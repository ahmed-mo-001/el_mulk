<!-- ================= الكارت الأول (Just Kids) ================= -->
<div class="course-card">
  <!-- الصورة قابلة للضغط (Clickable) - حط مسار الصفحة في href ومسار صورتك في src -->
  <a href="single-course.html" class="course-img-link">
    <span class="card-age-badge badge-dark">Just Kids</span>
    <img
      src="/assets/images/Container.WebP"
      alt="Beginner Quran Reading"
      class="course-img"
    />
  </a>

  <!-- التاجات الصغيرة تحت الصورة -->
  <div class="course-tags">
    <span class="course-tag">Foundational</span>
    <span class="course-tag">All ages</span>
  </div>

  <!-- عنوان ووصف الكورس -->
  <h3 class="course-title">
    <a href="">Beginner Quran Reading</a>
  </h3>
  <p class="course-desc">
    Learn the Arabic alphabet, letter connecting rules, and vowel vocalization
    using the renowned Noorani Qaida.
  </p>

  <!-- أزرار الكارت السفلية (Course Details + السهم البرتقالي) -->
  <div class="course-footer">
    <!-- حط مسار صفحة تفاصيل الكورس هنا -->
    <a href="single-course.html" class="btn-course-details">
      <svg class="help-bubble-icon" viewBox="0 0 24 24" fill="none">
        <path
          d="M12 2C6.48 2 2 6.03 2 11C2 13.13 2.82 15.08 4.2 16.62L3 21L7.79 19.34C9.1 19.77 10.52 20 12 20C17.52 20 22 15.97 22 11C22 6.03 17.52 2 12 2Z"
          fill="#FFFFFF"
        />
        <path
          d="M10.5 9.25C10.5 8.42 11.17 7.75 12 7.75C12.83 7.75 13.5 8.42 13.5 9.25C13.5 9.85 13.15 10.36 12.64 10.6C12.25 10.78 12 11.16 12 11.59V12.25"
          stroke="#08575B"
          stroke-width="1.8"
          stroke-linecap="round"
        />
        <circle cx="12" cy="14.5" r="1" fill="#08575B" />
      </svg>
      <span>Course Details</span>
    </a>

    <!-- حط مسار صفحة تفاصيل الكورس هنا برضه لزرار السهم -->
    <a
      href="single-course.html"
      class="btn-course-arrow"
      aria-label="Go to course details"
    >
      <svg viewBox="0 0 24 24" fill="none">
        <path
          d="M7 17L17 7M17 7H8M17 7V16"
          stroke="currentColor"
          stroke-width="2.3"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>

  </div>
</div>
